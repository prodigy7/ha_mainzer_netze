name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Lint, type check, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy custom_components/mainzer_netze --ignore-missing-imports --check-untyped-defs
      - name: Pytest
        run: pytest tests/ -v
